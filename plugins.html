<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahbi AI · Plugins</title>
<style>
:root{color-scheme:dark;--line:rgba(255,255,255,.08);--muted:#94a3b8;--a:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#070b14;color:#fff;font-family:Inter,system-ui,sans-serif}header{padding:12px 14px;border-bottom:1px solid var(--line)}.head{max-width:900px;margin:auto;display:flex;justify-content:space-between}.muted{color:var(--muted);font-size:12px}main{max-width:900px;margin:auto;padding:18px 14px}.plug{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:#0e1729;padding:13px;border-radius:14px;margin:9px 0}.plug .i{font-size:25px}.grow{flex:1}button{font:inherit;border:1px solid var(--line);background:#172036;color:#fff;border-radius:10px;padding:8px 10px}.on{background:#14532d}
</style></head><body><header><div class="head"><div><b>🔌 Sahbi AI Plugins</b><div class="muted">Capacités activables localement</div></div><button onclick="location.href='./'">← Chat</button></div></header><main id="list"></main>
<script>
const defs=[["web","🌐","Web Research","Recherche encyclopédique et lecture URL"],["weather","☀️","Weather","Météo en direct"],["fx","💱","Currency","Conversion de devises"],["ocr","🖼️","OCR","Lecture de texte dans les images"],["docs","📄","Documents","PDF, texte, CSV, code"],["voice","🎙️","Voice","Dictée et lecture vocale"],["builder","🛠️","Builder","Création d’apps et sites"],["sandbox","🧪","Sandbox","Exécution JS/Python"],["skills","🧠","Skills","Apprentissage déclaratif"],["projects","📁","Projects","Espaces projet séparés"]];
const key="sahbi_plugins";const get=()=>JSON.parse(localStorage.getItem(key)||"{}"),set=x=>localStorage.setItem(key,JSON.stringify(x));
function render(){const s=get(),box=document.querySelector("#list");box.innerHTML="";defs.forEach(([id,ic,n,d])=>{if(s[id]===undefined)s[id]=true;const el=document.createElement("div");el.className="plug";el.innerHTML=`<div class="i">${ic}</div><div class="grow"><b>${n}</b><div class="muted">${d}</div></div>`;const b=document.createElement("button");b.textContent=s[id]?"ON":"OFF";b.className=s[id]?"on":"";b.onclick=()=>{s[id]=!s[id];set(s);render()};el.appendChild(b);box.appendChild(el)});set(s)}render();
</script></body></html>
