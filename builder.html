<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>Sahbi AI Builder</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101827;--line:#26324d;--text:#f8fafc;--muted:#94a3b8;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b1020;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:grid;place-items:center;font-weight:800}
button,select,textarea,input{font:inherit}button,select{border:1px solid var(--line);background:#172036;color:#fff;border-radius:10px;padding:8px 11px}button{cursor:pointer}.primary{background:var(--accent);border-color:transparent}.danger{background:#451a1a}
.grid{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 64px)}
.side{border-right:1px solid var(--line);padding:14px;overflow:auto}.side textarea{width:100%;min-height:150px;background:#0f172a;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;resize:vertical}
.label{font-size:12px;color:var(--muted);margin:12px 0 6px}.row{display:flex;gap:8px;flex-wrap:wrap}
.status{margin-top:12px;background:#0f172a;border:1px solid var(--line);padding:10px;border-radius:10px;font-size:13px;color:#cbd5e1}
.projects{margin-top:14px}.project{padding:9px;border:1px solid var(--line);border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;gap:6px;align-items:center}
.work{display:grid;grid-template-rows:46px 1fr 46%;min-width:0}.tabs{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:#0d1423}.tabs button.active{background:#312e81}
.editor{width:100%;height:100%;resize:none;border:0;outline:0;background:#0b1220;color:#dbeafe;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;padding:14px}
.preview{border-top:1px solid var(--line);background:#fff}.preview iframe{width:100%;height:100%;border:0;background:#fff}
@media(max-width:900px){.grid{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.work{height:900px}}
</style>
</head><body>
<header><div class="brand"><div class="logo">S</div><div><b>Sahbi AI Builder</b><div style="font-size:11px;color:#94a3b8">Sites & apps · Core v2 Builder</div></div></div><div class="row"><button onclick="location.href='./'">← Chat</button><button id="download">⬇️ HTML</button><button id="downloadZip">📦 ZIP courant</button><button onclick="location.href='./deploy.html'">🚀 Deploy Hub</button></div></header>
<div class="grid">
<section class="side">
  <div class="label">Modèle</div>
  <select id="model" disabled><option selected>Sahbi Cloud · Core v2</option></select>
  <button id="load" class="primary" disabled>Cloud prêt</button>
  <div class="label">Type de projet</div>
<select id="projectType">
<option value="auto" selected>Auto · je détecte</option>
<option value="web">Site / App web</option>
<option value="software">Logiciel / CLI / Backend</option>
<option value="systems">Système / OS / bas niveau</option>
</select>
<div class="label">Décris ce que tu veux construire</div>
  <textarea id="brief" placeholder="Ex: Une app de petites annonces au Maroc avec recherche, cartes, favoris et design premium…"></textarea>
  <div class="row">
    <button id="build" class="primary">⚡ Construire</button>
    <button id="autopilot">🧠 Autopilot</button>
    <button id="ship">🏁 Produit final</button>
    <button id="test">🧪 Build & Test</button>
    <button id="improve">✨ Améliorer</button>
    <button id="fix">🧯 Corriger</button>
  </div>
  <div class="status" id="status">Sahbi Cloud prêt — Railway + OpenRouter, aucun compte externe requis.</div>
<div class="status" id="plan" style="display:none"></div>
<div class="status" id="testlog" style="display:none;white-space:pre-wrap"></div>
<div class="status" id="shiplog" style="display:none;white-space:pre-wrap"></div>
  <div class="projects">
    <div class="label">Projets locaux</div>
    <div id="projectList"></div>
    <div class="row"><input id="projectName" placeholder="Nom du projet" style="flex:1;background:#0f172a;color:white;border:1px solid var(--line);border-radius:10px;padding:8px"><button id="save">💾 Sauver</button></div>
  </div>
</section>
<section class="work">
  <div class="tabs"><button data-tab="html" class="active">HTML</button><button data-tab="css">CSS</button><button data-tab="js">JS</button><span style="margin-left:auto;color:#94a3b8;font-size:12px">Preview automatique</span></div>
  <textarea id="editor" class="editor"></textarea>
  <div class="preview"><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const SAHBI_API="https://sahbi-api-production.up.railway.app";
const ownerToken=localStorage.getItem("sahbi_owner_token")||"";
async function cloudChat(messages,maxTokens=7000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),30000);
  try{
    const r=await fetch(SAHBI_API+"/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json",...(ownerToken?{"X-Sahbi-Owner-Token":ownerToken}:{})},
      body:JSON.stringify({messages,max_tokens:maxTokens}),
      signal:controller.signal
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok){if(r.status===429)throw new Error("Limite cloud temporaire. Réessaie dans quelques secondes.");throw new Error(data?.message||data?.error||("Erreur cloud HTTP "+r.status));}
    const text=String(data?.text||"").trim();
    if(!text) throw new Error("Réponse IA vide");
    return text;
  }catch(e){
    if(e?.name==="AbortError") throw new Error("Délai IA dépassé. Réessaie.");
    throw e;
  }finally{clearTimeout(timer)}
}
const cloudEngine={chat:{completions:{create:async o=>{const text=await cloudChat(o.messages||[],o.max_tokens||7000);return {choices:[{message:{content:text}}]}}}}};
async function remoteRun(language,code,stdin=""){
  if(!ownerToken)throw new Error("Active d'abord le mode Owner dans Sahbi pour utiliser le Runner.");
  const r=await fetch(SAHBI_API+"/api/run",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Sahbi-Owner-Token":ownerToken},
    body:JSON.stringify({language,code,stdin})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.message||data?.error||("Runner HTTP "+r.status));
  return data;
}

let engine=cloudEngine,current="html",projectFiles=[],activeProject=localStorage.getItem("sahbi_active_project")||"";
let files={html:`<main style="font-family:system-ui;padding:40px"><h1>Sahbi AI Builder</h1><p>Décris ton application puis clique Construire.</p></main>`,css:"",js:""};
function show(){ $("#editor").value=files[current]; document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===current)); preview();}
function preview(){const doc=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${files.css}</style></head><body>${files.html}<script>${files.js.replace(/<\/script>/g,"<\\/script>")}<\/script></body></html>`;$("#frame").srcdoc=doc}
$("#editor").oninput=e=>{files[current]=e.target.value;preview()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{files[current]=$("#editor").value;current=b.dataset.tab;show()});
show();if(activeProject){const p=JSON.parse(localStorage.getItem("sahbi_projects")||"{}")[activeProject];if(p){$("#projectName").value=activeProject;$("#brief").value=(p.memory||"")?("Contexte projet "+activeProject+":\n"+p.memory):$("#brief").value;$("#status").textContent="Projet actif: "+activeProject+" — contexte chargé depuis Project Hub."}}

$("#load").onclick=async()=>{engine=cloudEngine;$("#status").textContent="Sahbi Cloud prêt ✅ — Railway + OpenRouter";};

function extract(raw){
 const m=raw.match(/\{[\s\S]*\}/); if(!m) throw new Error("Réponse de code invalide");
 const d=JSON.parse(m[0]); return {html:d.html||"",css:d.css||"",js:d.js||""};
}
function detectType(brief){const b=brief.toLowerCase();if(/système d'exploitation|operating system|\bos\b|kernel|bootloader|bare metal|driver/.test(b))return "systems";if(/api|backend|serveur|cli|python|node|logiciel|desktop|script/.test(b))return "software";return "web"}
async function ask(mode){
 if(!engine)return;
 const brief=$("#brief").value.trim();
 $("#status").textContent=mode==="build"?"Construction…":mode==="fix"?"Diagnostic et correction…":"Amélioration…";
 const chosen=$("#projectType").value==="auto"?detectType(brief):$("#projectType").value;
 const webMode=chosen==="web";
 const spec=webMode?`Tu es Sahbi AI Builder, architecte logiciel et designer frontend senior.
Retourne UNIQUEMENT un objet JSON valide avec exactement ces clés: {"html":"...","css":"...","js":"..."}.
Aucun markdown ni explication.
Crée une application web complète, responsive, élégante et fonctionnelle en HTML/CSS/JS vanilla. Les boutons doivent fonctionner. Ajoute validation, états vides, accessibilité et responsive.
MODE: ${mode}
DEMANDE: ${brief||"Améliore l'application existante."}
CODE ACTUEL:`:`Tu es Sahbi AI Builder Pro, architecte logiciel senior spécialisé en systèmes, backend, CLI et logiciels.
Retourne UNIQUEMENT un objet JSON valide de cette forme:
{"summary":"résumé","run":"commandes de build/run","files":[{"path":"README.md","content":"..."},{"path":"src/...","content":"..."}]}
Aucun markdown hors JSON.
Tu dois créer un VRAI squelette de projet cohérent, multi-fichiers, avec README, architecture, commandes de compilation et code initial.
Si la demande est un système d'exploitation, construis un projet ÉDUCATIF minimal et réaliste (par exemple kernel Rust/C + bootloader/config adaptée), explique les prérequis dans README, et ne prétends jamais produire un OS complet de production en une seule génération.
Privilégie du code compilable, une structure claire et des étapes progressives.
TYPE: ${chosen}
MODE: ${mode}
DEMANDE: ${brief||"Construis le projet demandé."}`;
 if(webMode) spec+=`

HTML:
${files.html.slice(0,12000)}
CSS:
${files.css.slice(0,9000)}
JS:
${files.js.slice(0,12000)}
`;
 try{
   const r=await engine.chat.completions.create({messages:[{role:"system",content:spec}],temperature:mode==="fix"?0.15:.4,max_tokens:7000});
   const raw=r.choices?.[0]?.message?.content||"";
   if(webMode){files=extract(raw);projectFiles=[];current="html";show();$("#plan").style.display="none";$("#status").textContent="Terminé ✅ — teste la preview puis demande une amélioration."}
   else{const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error("Projet multi-fichiers invalide");const d=JSON.parse(m[0]);projectFiles=Array.isArray(d.files)?d.files:[];$("#plan").style.display="block";$("#plan").textContent=(d.summary||"Projet généré")+"\n\nBuild / Run:\n"+(d.run||"Voir README")+"\n\nFichiers:\n"+projectFiles.map(x=>"• "+x.path).join("\n");$("#status").textContent="Projet système/logiciel généré ✅ — télécharge le ZIP pour compiler sur un PC ou sandbox."}
 }catch(e){$("#status").textContent="Erreur Builder: "+(e.message||e)}
}
$("#build").onclick=()=>ask("build");$("#improve").onclick=()=>ask("improve");$("#fix").onclick=()=>ask("fix");

function basicStaticChecks(){
 const issues=[];
 if(files.html && !/<[a-z][\s\S]*>/i.test(files.html))issues.push("HTML: aucune balise détectée.");
 try{new Function(files.js||"");}catch(e){issues.push("JS: "+e.message);}
 const ids=[...files.html.matchAll(/id=["']([^"']+)["']/g)].map(m=>m[1]);
 const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);
 if(dup.length)issues.push("HTML: IDs dupliqués: "+[...new Set(dup)].join(", "));
 if(/fetch\(["']http:\/\//i.test(files.js))issues.push("JS: appel HTTP non sécurisé détecté.");
 return issues;
}
function collectIssues(){
 const chosen=$("#projectType").value==="auto"?detectType($("#brief").value):$("#projectType").value;
 const issues=[];
 if(chosen==="web"){
   if(files.html && !/<[a-z][\s\S]*>/i.test(files.html))issues.push("HTML invalide ou vide");
   try{new Function(files.js||"");}catch(e){issues.push("Erreur JS: "+e.message)}
   const ids=[...files.html.matchAll(/id=["']([^"']+)["']/g)].map(m=>m[1]);
   const dup=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))];
   if(dup.length)issues.push("IDs HTML dupliqués: "+dup.join(", "));
   if(/fetch\(["']http:\/\//i.test(files.js))issues.push("Appel HTTP non sécurisé");
 } else {
   const paths=projectFiles.map(f=>f.path);
   if(!paths.length)issues.push("Aucun fichier généré");
   if(!paths.some(p=>/README\.md$/i.test(p)))issues.push("README.md manquant");
   if(paths.some(p=>p.startsWith("/")||p.includes("../")))issues.push("Chemins de fichiers dangereux");
   if(chosen==="systems"&&!paths.some(p=>/Cargo\.toml$|Makefile$|CMakeLists\.txt$|\.c$|\.rs$/i.test(p)))issues.push("Projet système sans source/build reconnu");
 }
 return issues;
}
async function repairFromIssues(issues){
 const chosen=$("#projectType").value==="auto"?detectType($("#brief").value):$("#projectType").value;
 if(!issues.length)return true;
 $("#status").textContent="Autopilot corrige: "+issues.join(" · ");
 if(chosen==="web"){
   const spec=`Tu es un ingénieur senior. Corrige uniquement les problèmes listés. Retourne UNIQUEMENT JSON {"html":"...","css":"...","js":"..."}.
PROBLÈMES: ${issues.join(" | ")}
HTML:${files.html.slice(0,12000)}
CSS:${files.css.slice(0,9000)}
JS:${files.js.slice(0,12000)}`;
   const r=await engine.chat.completions.create({messages:[{role:"system",content:spec}],temperature:.15,max_tokens:5000});
   files=extract(r.choices?.[0]?.message?.content||"");current="html";show();return true;
 } else {
   const spec=`Tu es un ingénieur logiciel senior. Corrige ce projet multi-fichiers. Retourne UNIQUEMENT JSON {"summary":"...","run":"...","files":[{"path":"...","content":"..."}]}.
PROBLÈMES: ${issues.join(" | ")}
PROJET: ${JSON.stringify(projectFiles).slice(0,25000)}`;
   const r=await engine.chat.completions.create({messages:[{role:"system",content:spec}],temperature:.15,max_tokens:7000});
   const raw=r.choices?.[0]?.message?.content||"";const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error("Correction multi-fichiers invalide");const d=JSON.parse(m[0]);projectFiles=Array.isArray(d.files)?d.files:projectFiles;$("#plan").style.display="block";$("#plan").textContent=(d.summary||"Projet corrigé")+"\n\nBuild / Run:\n"+(d.run||"Voir README")+"\n\nFichiers:\n"+projectFiles.map(x=>"• "+x.path).join("\n");return true;
 }
}
async function runLocalTests(){
 const log=$("#testlog");log.style.display="block";log.textContent="Préparation de la sandbox locale…";
 const chosen=$("#projectType").value==="auto"?detectType($("#brief").value):$("#projectType").value;
 if(chosen!=="web"){
   const paths=projectFiles.map(f=>f.path);
   const checks=[];
   if(!paths.length)checks.push("Aucun fichier multi-fichiers généré.");
   if(!paths.some(p=>/README\.md$/i.test(p)))checks.push("README.md manquant.");
   const bad=paths.filter(p=>p.startsWith("/")||p.includes("../"));
   if(bad.length)checks.push("Chemins invalides: "+bad.join(", "));
   if(chosen==="systems"&&!paths.some(p=>/Cargo\.toml$|Makefile$|CMakeLists\.txt$|\.c$|\.rs$/i.test(p)))checks.push("Projet système: aucun fichier de build/source bas niveau reconnu.");

   let remote="";
   const candidate=projectFiles.find(f=>/\.(py|js|cpp|java)$/i.test(f.path||"") && String(f.content||"").length<=900);
   if(candidate && ownerToken){
     const ext=(candidate.path.split(".").pop()||"").toLowerCase();
     const lang=ext==="py"?"python":ext==="js"?"javascript":ext==="cpp"?"cpp":"java";
     try{
       log.textContent="🧪 Runner cloud: "+candidate.path+"…";
       const rr=await remoteRun(lang,String(candidate.content||""));
       remote="\n\nRunner cloud ("+candidate.path+"):\nStatus: "+rr.status+"\n"+(rr.stdout?"STDOUT:\n"+rr.stdout:"")+(rr.stderr?"\nSTDERR:\n"+rr.stderr:"");
       if(!rr.ok)checks.push("Runner: "+rr.status);
     }catch(e){
       remote="\n\nRunner indisponible: "+(e.message||e);
     }
   }else if(!ownerToken){
     remote="\n\n💡 Active le mode Owner pour exécuter automatiquement les petits fichiers Python/JS/C++/Java dans la sandbox.";
   }else{
     remote="\n\nℹ️ Aucun fichier unique ≤900 caractères compatible avec le Runner rapide. Validation structurelle uniquement.";
   }

   log.textContent=(checks.length?"⚠️ Validation:\n- "+checks.join("\n- "):"✅ Structure du projet cohérente.")+remote+"\n\nRust/kernel et projets multi-fichiers nécessitent encore une sandbox de build dédiée.";
   return;
 }
 const issues=basicStaticChecks();
 let runtimeError="";
 const oldErr=window.onerror;
 window.onerror=(msg,src,line,col)=>{runtimeError+=String(msg)+" @ "+line+":"+col+"\n";return true};
 try{
   const iframe=$("#frame");
   preview();
   await new Promise(r=>setTimeout(r,700));
 }finally{window.onerror=oldErr}
 if(runtimeError)issues.push("Runtime preview: "+runtimeError.trim());
 log.textContent=issues.length?"⚠️ Tests terminés avec remarques:\n- "+issues.join("\n- "):"✅ Build & Test local terminé sans erreur détectée.";
}
$("#test").onclick=runLocalTests;
$("#autopilot").onclick=async()=>{if(!engine)return;$("#autopilot").disabled=true;try{
 $("#status").textContent="Autopilot: construction initiale…";
 await ask("build");
 for(let i=1;i<=3;i++){const issues=collectIssues();if(!issues.length){$("#status").textContent="Autopilot terminé ✅ — aucun problème structurel détecté après "+i+" passe(s).";break}$("#status").textContent="Autopilot passe "+i+"/3 — "+issues.join(" · ");await repairFromIssues(issues);if(i===3)$("#status").textContent="Autopilot terminé avec vérifications. Consulte Build & Test pour le rapport final."}
}catch(e){$("#status").textContent="Autopilot erreur: "+(e.message||e)}finally{$("#autopilot").disabled=false}};
async function packageFinalProduct(){
 const chosen=$("#projectType").value==="auto"?detectType($("#brief").value):$("#projectType").value;
 const JSZip=(await import("https://esm.run/jszip@3.10.1")).default;
 const zip=new JSZip();
 const productName=($("#projectName").value.trim()||"sahbi-product").replace(/[^a-z0-9-_]+/gi,"-").toLowerCase();
 if(chosen==="web"){
   const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${productName}</title><style>${files.css}</style></head><body>${files.html}<script>${files.js.replace(/<\/script>/g,"<\\/script>")}<\/script></body></html>`;
   zip.file("index.html",html);
   zip.file("README.md","# "+productName+"\n\nProduit final généré par Sahbi AI Builder.\n\nOuvre index.html ou déploie le dossier sur GitHub Pages / Cloudflare Pages.");
 }else{
   for(const f of projectFiles)zip.file(f.path,f.content||"");
   if(!projectFiles.some(f=>/README\.md$/i.test(f.path)))zip.file("README.md","# "+productName+"\n\nProduit final généré par Sahbi AI Builder.");
 }
 zip.file("SAHBI-DELIVERY.txt",
`SAHBI AI — LIVRAISON PRODUIT
Nom: ${productName}
Type: ${chosen}
Date: ${new Date().toISOString()}
Autopilot: effectué
Vérifications locales: effectuées
Important: pour logiciels natifs, backends ou OS, compiler/tester aussi dans l'environnement cible avant usage production.
`);
 const blob=await zip.generateAsync({type:"blob"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=productName+"-final.zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
 return productName+"-final.zip";
}
async function shipFinal(){
 if(!engine)return;
 const box=$("#shiplog");box.style.display="block";$("#ship").disabled=true;
 try{
   box.textContent="1/5 — Construction du produit…";
   await ask("build");
   box.textContent="2/5 — Vérification…";
   let issues=collectIssues();
   for(let i=0;i<3&&issues.length;i++){box.textContent="3/5 — Correction automatique passe "+(i+1)+"/3…\n"+issues.join("\n");await repairFromIssues(issues);issues=collectIssues()}
   box.textContent="4/5 — Packaging final…";
   const filename=await packageFinalProduct();
   box.textContent="5/5 — Produit final prêt ✅\n\nFichier livré: "+filename+"\n\nLe ZIP contient le projet final et les instructions de lancement/déploiement.";
   $("#status").textContent="🏁 Livraison terminée — ton produit final a été téléchargé.";
 }catch(e){
   box.textContent="Erreur pendant la livraison: "+(e.message||e);
 }finally{$("#ship").disabled=false}
}
$("#ship").onclick=shipFinal;

function projects(){return JSON.parse(localStorage.getItem("sahbi_builder_projects")||"{}")}
function renderProjects(){const p=projects(),box=$("#projectList");box.innerHTML="";Object.keys(p).forEach(name=>{const d=document.createElement("div");d.className="project";const n=document.createElement("span");n.textContent=name;n.style.cursor="pointer";n.onclick=()=>{files=p[name].files;$("#brief").value=p[name].brief||"";$("#projectName").value=name;current="html";show()};const del=document.createElement("button");del.textContent="🗑";del.className="danger";del.onclick=()=>{const q=projects();delete q[name];localStorage.setItem("sahbi_builder_projects",JSON.stringify(q));renderProjects()};d.append(n,del);box.appendChild(d)})}
$("#save").onclick=()=>{const name=$("#projectName").value.trim()||("Projet "+new Date().toLocaleString());const p=projects();p[name]={files,brief:$("#brief").value,updated:new Date().toISOString()};localStorage.setItem("sahbi_builder_projects",JSON.stringify(p));$("#projectName").value=name;renderProjects();$("#status").textContent="Projet sauvegardé localement ✅"};renderProjects();

$("#downloadZip").onclick=async()=>{try{const JSZip=(await import("https://esm.run/jszip@3.10.1")).default;const zip=new JSZip();if(projectFiles.length){for(const f of projectFiles)zip.file(f.path,f.content||"")}else{zip.file("index.html",`<!doctype html><html><head><meta charset="utf-8"><style>${files.css}</style></head><body>${files.html}<script>${files.js.replace(/<\/script>/g,"<\\/script>")}<\/script></body></html>`);zip.file("README.md","Generated by Sahbi AI Builder")}const blob=await zip.generateAsync({type:"blob"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=($("#projectName").value.trim()||"sahbi-project").replace(/[^a-z0-9-_]+/gi,"-").toLowerCase()+".zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){$("#status").textContent="Erreur ZIP: "+(e.message||e)}};
$("#download").onclick=async()=>{const doc=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${files.css}</style></head><body>${files.html}<script>${files.js.replace(/<\/script>/g,"<\\/script>")}<\/script></body></html>`;const blob=new Blob([doc],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=($("#projectName").value.trim()||"sahbi-app").replace(/[^a-z0-9-_]+/gi,"-").toLowerCase()+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
</script></body></html>
