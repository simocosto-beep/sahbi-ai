<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Sahbi AI Sandbox</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070b14;
  --panel:#0c1322;
  --panel2:#10192b;
  --line:#1f2a44;
  --text:#f8fafc;
  --muted:#8ea0bd;
  --accent:#7c3aed;
  --accent2:#0ea5e9;
  --danger:#ef4444;
  --ok:#22c55e;
  --shadow:0 18px 60px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(900px 500px at 15% -10%,rgba(124,58,237,.22),transparent 60%),
radial-gradient(900px 500px at 110% 0%,rgba(14,165,233,.18),transparent 60%),
linear-gradient(180deg,#070b14,#0a1020 55%,#080d18);
color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:max(14px,env(safe-area-inset-bottom))}
.shell{max-width:1180px;margin:0 auto;padding:14px}
header{
  position:sticky;top:0;z-index:10;
  backdrop-filter:blur(18px);
  background:rgba(7,11,20,.82);
  border-bottom:1px solid rgba(255,255,255,.06)
}
.header-inner{max-width:1180px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;box-shadow:0 10px 30px rgba(124,58,237,.25)}
.title-wrap{min-width:0}.title{font-size:17px;font-weight:800;letter-spacing:.2px}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
button,select,textarea{font:inherit}
button,select{
  border:1px solid rgba(255,255,255,.09);
  background:rgba(17,28,49,.92);
  color:#fff;border-radius:12px;padding:9px 12px
}
button{cursor:pointer;transition:.18s transform,.18s background,.18s border-color}
button:hover{transform:translateY(-1px);background:#17243d}
button.primary{background:linear-gradient(135deg,#6d28d9,#7c3aed);border-color:transparent;box-shadow:0 10px 28px rgba(124,58,237,.28)}
button.danger{background:rgba(127,29,29,.35);border-color:rgba(239,68,68,.3)}
button.icon{width:40px;padding:9px;display:grid;place-items:center}
.main-card{
  background:linear-gradient(180deg,rgba(12,19,34,.96),rgba(9,15,27,.96));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:var(--shadow);
  border-radius:20px;
  overflow:hidden;
}
.toolbar{
  min-height:58px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)
}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;padding:6px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.09);color:#cbd5e1;background:rgba(255,255,255,.03)}
.badge.safe{color:#bbf7d0;border-color:rgba(34,197,94,.24);background:rgba(34,197,94,.08)}
.badge.local{color:#bae6fd;border-color:rgba(14,165,233,.24);background:rgba(14,165,233,.08)}
.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);min-height:680px}
.editor-pane,.output-pane{min-width:0}
.editor-pane{border-right:1px solid rgba(255,255,255,.06);background:#07101c}
.output-pane{background:#08111d}
.pane-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:#9fb0c9;background:rgba(255,255,255,.018)}
textarea.code{
  width:100%;height:636px;resize:none;border:0;outline:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/32px 100%,
    #07101c;
  color:#e5eefc;padding:18px 18px 30px;
  font:14px/1.62 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  tab-size:2
}
pre.output{
  margin:0;height:636px;overflow:auto;padding:18px;
  white-space:pre-wrap;word-break:break-word;
  color:#cfe2ff;background:#08111d;
  font:13px/1.62 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px rgba(34,197,94,.55)}
.helper{color:var(--muted);font-size:12px}
.mobile-actions{display:none}
@media(max-width:900px){
  .shell{padding:10px}
  .header-inner{align-items:flex-start}
  .nav{display:none}
  .workspace{grid-template-columns:1fr;min-height:unset}
  .editor-pane{border-right:0;border-bottom:1px solid rgba(255,255,255,.06)}
  textarea.code,pre.output{height:44vh;min-height:340px}
  .toolbar{align-items:stretch;flex-direction:column}
  .toolbar-left,.toolbar-right{width:100%}
  .toolbar-right{justify-content:space-between}
  .mobile-actions{display:flex;gap:8px}
  .main-card{border-radius:16px}
}
@media(max-width:520px){
  .header-inner{padding:10px}
  .logo{width:38px;height:38px;border-radius:12px}
  .title{font-size:16px}
  .toolbar-left select{flex:1;min-width:0}
  .toolbar-right{display:grid;grid-template-columns:1fr 1fr}
  .toolbar-right .badge{grid-column:1/-1}
  textarea.code{font-size:13px;padding:14px}
  pre.output{font-size:12px;padding:14px}
}
</style></head><body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo">S</div>
      <div class="title-wrap">
        <div class="title">Sahbi AI Sandbox</div>
        <div class="subtitle">Dev Studio · exécution locale isolée</div>
      </div>
    </div>
    <div class="nav">
      <button onclick="location.href='./'">← Chat</button>
      <button onclick="location.href='./builder.html'">🛠️ Builder</button>
    </div>
  </div>
</header>

<main class="shell">
  <section class="main-card">
    <div class="toolbar">
      <div class="toolbar-left">
        <select id="lang">
          <option value="js">JavaScript</option>
          <option value="py">Python · Pyodide</option>
        </select>
        <span class="badge safe">● Isolé</span>
        <span class="badge local">Local-first</span>
      </div>
      <div class="toolbar-right">
        <button id="run" class="primary">▶ Exécuter</button>
        <button id="stop" class="danger">■ Stop</button>
        <span class="badge">Timeout 8 s</span>
      </div>
      <div class="mobile-actions">
        <button onclick="location.href='./'">← Chat</button>
        <button onclick="location.href='./builder.html'">🛠️ Builder</button>
      </div>
    </div>

    <div class="workspace">
      <section class="editor-pane">
        <div class="pane-head">
          <span>ÉDITEUR</span>
          <span class="helper">Ctrl/⌘ + Enter pour exécuter</span>
        </div>
        <textarea id="code" class="code">console.log("Salam depuis Sahbi AI Sandbox 👋");</textarea>
      </section>

      <section class="output-pane">
        <div class="pane-head">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="status-dot"></span>
            <span>CONSOLE</span>
          </div>
          <button id="clear" class="icon" title="Effacer">🧹</button>
        </div>
        <pre id="out" class="output">Prêt.</pre>
      </section>
    </div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);let worker=null,timer=null;
function log(t){$("#out").textContent+=($("#out").textContent?"\n":"")+t}
function stop(){if(worker){worker.terminate();worker=null}clearTimeout(timer);timer=null}
$("#stop").onclick=()=>{stop();log("⛔ Exécution arrêtée.")};$("#clear").onclick=()=>$("#out").textContent="";
function runJS(src){
 const blob=new Blob([`self.console={log:(...a)=>postMessage({t:"log",v:a.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" ")}),error:(...a)=>postMessage({t:"log",v:a.join(" ")})};
 self.onmessage=async e=>{try{const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;const fn=new AsyncFunction(e.data);const r=await fn();if(r!==undefined)postMessage({t:"log",v:String(r)});postMessage({t:"done"})}catch(err){postMessage({t:"err",v:String(err?.stack||err)})}}`],{type:"text/javascript"});
 worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{if(e.data.t==="log")log(e.data.v);if(e.data.t==="err"){log("❌ "+e.data.v);stop()}if(e.data.t==="done"){log("✅ Terminé.");stop()}};worker.postMessage(src);
}
function runPY(src){
 const code=`importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
 let py=null;self.onmessage=async e=>{try{if(!py)py=await loadPyodide({stdout:s=>postMessage({t:"log",v:s}),stderr:s=>postMessage({t:"log",v:s})});const r=await py.runPythonAsync(e.data);if(r!==undefined&&r!==null)postMessage({t:"log",v:String(r)});postMessage({t:"done"})}catch(err){postMessage({t:"err",v:String(err?.stack||err)})}}`;
 const blob=new Blob([code],{type:"text/javascript"});worker=new Worker(URL.createObjectURL(blob));worker.onmessage=e=>{if(e.data.t==="log")log(e.data.v);if(e.data.t==="err"){log("❌ "+e.data.v);stop()}if(e.data.t==="done"){log("✅ Terminé.");stop()}};worker.postMessage(src);
}
$("#run").onclick=()=>{stop();$("#out").textContent="";const src=$("#code").value;if($("#lang").value==="js")runJS(src);else runPY(src);timer=setTimeout(()=>{if(worker){stop();log("⏱️ Timeout: exécution interrompue après 8 secondes.")}},8000)};
$("#code").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("#run").click()}});
$("#lang").onchange=()=>{$("#code").value=$("#lang").value==="js"?'console.log("Salam depuis Sahbi AI Sandbox 👋");':'print("Salam depuis Python 👋")'};
</script></body></html>
