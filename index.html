<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Sahbi AI</title><link rel="manifest" href="./manifest.json">
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--muted:#94a3b8;--text:#f8fafc;--line:#26324d;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);min-height:100vh}
.app{max-width:980px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:grid;place-items:center;font-weight:800}.sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,select,textarea{font:inherit}button,select{border:1px solid var(--line);background:#172036;color:#fff;border-radius:12px;padding:9px 12px}button{cursor:pointer}.primary{background:var(--accent);border-color:transparent}button:disabled{opacity:.5}
main{padding:18px 14px 125px}.status{border:1px solid var(--line);background:#121a2ecc;border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px}.status b{color:#c4b5fd}
.chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:86%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.45}.user{align-self:flex-end;background:#5b21b6}.assistant{align-self:flex-start;background:#182238;border:1px solid var(--line)}
.composer{position:fixed;bottom:0;left:0;right:0;background:#0b1020f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px}.composer-inner{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}
.inputwrap{display:flex;gap:8px;align-items:end;background:#121a2e;border:1px solid var(--line);border-radius:16px;padding:8px}.inputwrap textarea{width:100%;resize:none;max-height:180px;min-height:46px;border:0;outline:0;background:transparent;color:#fff;padding:8px}
.drawer{position:fixed;inset:0;z-index:20;background:#0009;display:none}.drawer.show{display:block}.panel{position:absolute;right:0;top:0;bottom:0;width:min(92vw,460px);background:#0f172a;border-left:1px solid var(--line);padding:18px;overflow:auto}.panel textarea{width:100%;min-height:170px;border-radius:12px;background:#111827;color:#fff;border:1px solid var(--line);padding:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.hint{font-size:12px;color:var(--muted)}
@media(max-width:640px){header{align-items:flex-start}.msg{max-width:94%}.actions select{max-width:150px}}
</style>
</head><body>
<div class="app">
<header>
<div class="brand"><div class="logo">S</div><div><strong>Sahbi AI</strong><div class="sub">Personnel · privé · sans clé API</div></div></div>
<div class="actions"><select id="model"><option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Rapide 1B</option><option value="Llama-3.2-3B-Instruct-q4f16_1-MLC" selected>Intelligent 3B</option></select><button id="load" class="primary">Charger l’IA</button><button id="memoryBtn">Mémoire</button><button id="clear">Nouveau</button></div>
</header>
<main><div class="status" id="status"><b>Mode gratuit :</b> le modèle tourne sur ton appareil. Le premier chargement télécharge le modèle puis le met en cache.</div><div class="chat" id="chat"></div></main>
<div class="composer"><div class="composer-inner"><div class="inputwrap"><textarea id="prompt" placeholder="Écris à Sahbi AI…"></textarea><button id="mic">🎙️</button></div><button id="send" class="primary" disabled>Envoyer</button></div></div>
</div>
<div class="drawer" id="drawer"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Mémoire personnelle</h2><button id="closeDrawer">✕</button></div><p class="hint">Stockée uniquement dans ce navigateur.</p><textarea id="memory" placeholder="Ex: Réponds surtout en français et darija. Mes projets principaux sont…"></textarea><div class="row"><button id="saveMemory" class="primary">Enregistrer</button><button id="exportBtn">Exporter</button><button id="importTrigger">Importer</button><input id="importFile" type="file" accept="application/json" hidden></div></div></div>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
const $=s=>document.querySelector(s),chat=$("#chat"),prompt=$("#prompt"),send=$("#send"),load=$("#load"),status=$("#status");
let engine=null,busy=false,history=JSON.parse(localStorage.getItem("sahbi_history")||"[]"),memory=localStorage.getItem("sahbi_memory")||"";$("#memory").value=memory;
function save(){localStorage.setItem("sahbi_history",JSON.stringify(history))}
function bubble(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"assistant");d.textContent=text;chat.appendChild(d);scrollTo(0,document.body.scrollHeight);return d}
function render(){chat.innerHTML="";if(!history.length)bubble("assistant","Salam 👋 Je suis Sahbi AI. Charge le modèle puis parle-moi.");for(const m of history)bubble(m.role,m.content)}render();
load.onclick=async()=>{if(engine)return;load.disabled=true;load.textContent="Chargement…";try{engine=await webllm.CreateMLCEngine($("#model").value,{initProgressCallback:p=>status.innerHTML="<b>Chargement :</b> "+Math.round((p.progress||0)*100)+"% — "+(p.text||"")});status.innerHTML="<b>Prêt ✅</b> L’IA fonctionne sur ton appareil, sans clé API.";send.disabled=false;load.textContent="IA prête"}catch(e){console.error(e);load.disabled=false;load.textContent="Réessayer";status.innerHTML="<b>Échec du chargement.</b> Essaie Chrome/Edge récent avec WebGPU, ou le modèle 1B."}};
async function run(){if(!engine||busy)return;const text=prompt.value.trim();if(!text)return;busy=true;prompt.value="";send.disabled=true;history.push({role:"user",content:text});save();bubble("user",text);const out=bubble("assistant","…");const sys=`Tu es Sahbi AI, un assistant personnel chaleureux, intelligent et pratique. Tu aides à réfléchir, écrire, organiser, coder et résoudre des problèmes. Tu peux répondre en français, arabe, darija ou anglais selon la demande. Sois honnête sur tes limites. Mémoire utilisateur:\n${memory||"(aucune)"}`;try{const stream=await engine.chat.completions.create({messages:[{role:"system",content:sys},...history.slice(-18)],temperature:.65,max_tokens:1200,stream:true});let acc="";for await(const ch of stream){acc+=ch.choices?.[0]?.delta?.content||"";out.textContent=acc||"…";scrollTo(0,document.body.scrollHeight)}history.push({role:"assistant",content:acc});save()}catch(e){out.textContent="Erreur : "+(e?.message||e)}busy=false;send.disabled=false}
send.onclick=run;prompt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();run()}});
$("#clear").onclick=()=>{history=[];save();render()};$("#memoryBtn").onclick=()=>$("#drawer").classList.add("show");$("#closeDrawer").onclick=()=>$("#drawer").classList.remove("show");$("#saveMemory").onclick=()=>{memory=$("#memory").value.trim();localStorage.setItem("sahbi_memory",memory);$("#drawer").classList.remove("show")};
$("#exportBtn").onclick=()=>{const b=new Blob([JSON.stringify({memory,history},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sahbi-ai-backup.json";a.click()};$("#importTrigger").onclick=()=>$("#importFile").click();$("#importFile").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const d=JSON.parse(await f.text());memory=d.memory||"";history=Array.isArray(d.history)?d.history:[];localStorage.setItem("sahbi_memory",memory);save();$("#memory").value=memory;render()};
$("#mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Dictée non disponible.");return}const r=new SR();r.lang="fr-FR";r.onresult=e=>prompt.value+=(prompt.value?" ":"")+e.results[0][0].transcript;r.start()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
